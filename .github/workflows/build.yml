name: Build OnePlus 7T Custom Kernel + SELinuxSwitcher Module

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      kernel_variant:
        description: 'Kernel variant'
        required: true
        default: 'permissive'
        type: choice
        options:
          - permissive
          - enforcing
          - disabled

env:
  KERNEL_DIR: kernel_oneplus_sm8150
  ANYKERNEL_DIR: AnyKernel3
  KBUILD_BUILD_USER: "Tymaa"
  KBUILD_BUILD_HOST: "GitHub-Actions"
  KBUILD_BUILD_VERSION: "+Tymaa"

jobs:
  build-kernel:
    name: Build Kernel (${{ github.event.inputs.kernel_variant || 'permissive' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      kernel_zip: ${{ steps.upload-kernel.outputs.zip-name }}
      module_zip: ${{ steps.upload-module.outputs.zip-name }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/kernel_oneplus_sm8150
          ref: oxygen-12
          path: ${{ env.KERNEL_DIR }}
          submodules: recursive

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: ${{ env.ANYKERNEL_DIR }}

      - name: Setup Google Clang
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          clang --version

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev \
            dwarves pahole cpio zip unzip \
            python3 python3-pyelftools \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler

      - name: Configure kernel (hotdogb-perf_defconfig)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make O=out ARCH=arm64 vendor/hotdogb-perf_defconfig

      - name: Patch SELinux to ${{ github.event.inputs.kernel_variant || 'permissive' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          VARIANT="${{ github.event.inputs.kernel_variant || 'permissive' }}"
          echo "[*] Setting SELinux to $VARIANT"

          scripts/config --file out/.config -e CONFIG_SECURITY_SELINUX
          scripts/config --file out/.config -e CONFIG_SECURITY_SELINUX_BOOTPARAM
          scripts/config --file out/.config -e CONFIG_SECURITY_SELINUX_DEVELOP
          scripts/config --file out/.config -e CONFIG_SECURITY_SELINUX_DISABLE

          case "$VARIANT" in
            permissive)
              scripts/config --file out/.config --set-str CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE "permissive"
              export KBUILD_BUILD_VERSION="+Tymaa"
              ;;
            enforcing)
              scripts/config --file out/.config --set-str CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE "enforcing"
              export KBUILD_BUILD_VERSION="+Tymaa"
              ;;
            disabled)
              scripts/config --file out/.config --set-str CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE "permissive"
              export KBUILD_BUILD_VERSION="+Tymaa-Disabled"
              ;;
          esac

          grep -E "CONFIG_SECURITY_SELINUX(_BOOTPARAM|_DEVELOP|_DISABLE)?=|CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE" out/.config

      - name: Build Image.gz + dtbo.img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image.gz dtbo.img 2>&1 | tail -30

      - name: Verify build artifacts
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          ls -la out/arch/arm64/boot/Image.gz
          ls -la out/arch/arm64/boot/dtbo.img
          ls -la out/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dtb
          make -s O=out ARCH=arm64 kernelversion

      - name: Pack AnyKernel3 ZIP
        working-directory: ${{ env.ANYKERNEL_DIR }}
        run: |
          VARIANT="${{ github.event.inputs.kernel_variant || 'permissive' }}"
          DATE=$(date +%Y%m%d)
          ZIP_NAME="kernel_7t_Tymaa_${VARIANT^}_${DATE}.zip"

          rm -f Image.gz dtbo.img
          rm -rf dtb/
          mkdir -p dtb/

          cp ../${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz .
          cp ../${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtbo.img .
          cp ../${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dtb dtb/

          zip -r9 "$ZIP_NAME" * -x ".git*" "README*" "*placeholder*" "*.zip" 2>/dev/null

          echo "zip-name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "[✅] Created: $ZIP_NAME ($(du -h $ZIP_NAME | cut -f1))"

      - name: Build SELinuxSwitcher Magisk Module
        run: |
          MOD_DIR=$(mktemp -d)
          cd "$MOD_DIR"

          cat > module.prop << 'MODULE_EOF'
id=selinuxswitcher
name=SELinux Mode Switcher (Tymaa Kernel)
version=1.0
versionCode=1
author=Tymaa
description=Switch SELinux: 1=Enforcing 2=Permissive. Requires Tymaa kernel (4.14.180+Tymaa). Disabled requires separate kernel build.
support=https://github.com/${{ github.repository }}
minMagisk=25000
MODULE_EOF

          cat > service.sh << 'SERVICE_EOF'
#!/system/bin/sh
MODDIR=${0%/*}
CONFIG_FILE="$MODDIR/se_mode.conf"
if [ -f "$CONFIG_FILE" ]; then
    MODE=$(cat "$CONFIG_FILE" 2>/dev/null | tr -d '\r\n')
else
    MODE=2
fi
case "$MODE" in
    1) echo 1 > /sys/fs/selinux/enforce 2>/dev/null; setprop ro.boot.selinux enforcing 2>/dev/null ;;
    2) echo 0 > /sys/fs/selinux/enforce 2>/dev/null; setprop ro.boot.selinux permissive 2>/dev/null ;;
esac
log -t SELinuxSwitcher "Boot: Applied mode $MODE ($(getenforce 2>/dev/null || echo 'unknown'))"
SERVICE_EOF

          cat > script.sh << 'SCRIPT_EOF'
#!/system/bin/sh
MODDIR=${0%/*}
CONFIG_FILE="$MODDIR/se_mode.conf"
clear
echo "========================================="
echo "   SELinux Mode Switcher (Tymaa Kernel)  "
echo "   Kernel: $(uname -r 2>/dev/null || echo 'unknown')"
echo "   Current: $(getenforce 2>/dev/null || echo 'unknown')"
echo "========================================="
echo ""
echo "  1) Enforcing   — blocks, logs"
echo "  2) Permissive  — allows, logs (default)"
echo "  3) Disabled    — requires SEPARATE kernel build"
echo "  0) Exit"
echo ""
printf "Select [1-3, 0]: "
read -r CHOICE
case "$CHOICE" in
    1) echo 1 > "$CONFIG_FILE"; echo 1 > /sys/fs/selinux/enforce 2>/dev/null; setprop ro.boot.selinux enforcing 2>/dev/null; MSG="Enforcing" ;;
    2) echo 2 > "$CONFIG_FILE"; echo 0 > /sys/fs/selinux/enforce 2>/dev/null; setprop ro.boot.selinux permissive 2>/dev/null; MSG="Permissive" ;;
    3) echo ""; echo "[!] Disabled = separate kernel build needed"; echo "    Flash kernel_7t_Tymaa_Disabled.zip"; read -p "Press Enter..."; exit 0 ;;
    *) exit 0 ;;
esac
echo ""; echo "[✅] Set: $MSG"; echo "    Current: $(getenforce 2>/dev/null)"; echo "Rebooting in 3 sec..."; sleep 3; reboot
SCRIPT_EOF

          mkdir -p META-INF/com/google/android

          cat > META-INF/com/google/android/updater-script << 'UPDATER_EOF'
ui_print("****************************************");
ui_print("  SELinux Mode Switcher for Tymaa Kernel");
ui_print("  1=Enforcing  2=Permissive  3=Disabled*");
ui_print("*Disabled requires separate kernel build");
ui_print("****************************************");
run_program("/sbin/sh", "-c", "mkdir -p /data/adb/modules/SELinuxSwitcher/bin");
run_program("/sbin/sh", "-c", "ln -sf /data/adb/modules/SELinuxSwitcher/script.sh /data/adb/modules/SELinuxSwitcher/bin/selinux-switch");
run_program("/sbin/sh", "-c", "chmod 755 /data/adb/modules/SELinuxSwitcher/script.sh");
run_program("/sbin/sh", "-c", "echo 2 > /data/adb/modules/SELinuxSwitcher/se_mode.conf");
ui_print(""); ui_print("✅ Installed!"); ui_print("Usage: su -c selinux-switch"); ui_print("");
UPDATER_EOF

          cat > META-INF/com/google/android/update-binary << 'UPDATE_BIN_EOF'
#!/sbin/sh
OUTFD=$2; ZIPFILE=$3
ui_print() { if [ $OUTFD != 0 ]; then echo "ui_print $1" > /proc/self/fd/$OUTFD; echo "ui_print" > /proc/self/fd/$OUTFD; else echo "$1"; fi; }
ui_print "Extracting SELinuxSwitcher..."
mkdir -p /data/adb/modules/SELinuxSwitcher
cd /data/adb/modules/SELinuxSwitcher
unzip -o "$ZIPFILE" -x 'META-INF/*' >/dev/null 2>&1
if [ -f META-INF/com/google/android/updater-script ]; then . META-INF/com/google/android/updater-script; fi
chmod 755 script.sh service.sh 2>/dev/null
mkdir -p bin; ln -sf script.sh bin/selinux-switch
ui_print ""; ui_print "✅ SELinuxSwitcher installed!"; ui_print "Run: su -c selinux-switch"; ui_print ""
exit 0
UPDATE_BIN_EOF

          chmod 755 script.sh service.sh META-INF/com/google/android/update-binary

          DATE=$(date +%Y%m%d)
          MOD_ZIP="SELinuxSwitcher_v1.0_${DATE}.zip"
          zip -r9 "$MOD_ZIP" module.prop service.sh script.sh META-INF/ -x "*.git*" 2>/dev/null
          cp "$MOD_ZIP" $GITHUB_WORKSPACE/

          echo "zip-name=$MOD_ZIP" >> $GITHUB_OUTPUT
          echo "[✅] Module: $MOD_ZIP ($(du -h $MOD_ZIP | cut -f1))"

      - name: Upload Kernel ZIP
        id: upload-kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-7t-tymaa-${{ github.event.inputs.kernel_variant || 'permissive' }}
          path: ${{ env.ANYKERNEL_DIR }}/kernel_7t_Tymaa_*.zip
          retention-days: 30

      - name: Upload Module ZIP
        id: upload-module
        uses: actions/upload-artifact@v4
        with:
          name: SELinuxSwitcher-module
          path: SELinuxSwitcher_v1.0_*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.ANYKERNEL_DIR }}/kernel_7t_Tymaa_*.zip
            SELinuxSwitcher_v1.0_*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}